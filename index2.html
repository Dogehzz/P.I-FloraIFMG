<!-- Arquivo principal do leitor de QR Code -->
 <!--Problemas: quandp abre pelo celular nao mostra a camera por causa do facingMode:"user" so isso -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner QR Code </title>
    
    <!-- Importando a biblioteca oficial de leitura de QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Área do vídeo cobrindo a tela inteira */
        #reader {
            display:flex;
            justify-content: center;
            align-items: center;
            width: 320px !important;
            height: 320px !important;
            z-index: 1;
            position: fixed;
            top: 47%;
            left: 50%;
            transform: translate(-50%, -50%)
        }

        #reader video { /* meche na imagem da camera*/
            display:flex;
            justify-content: center;
            align-items: center;
            width: 100% !important;
            height:100% !important;
            object-fit: cover !important;
            transform: scaleX(-1); /* para inverter o Efeito espelho da biblioteca qr code  */
        }

        /* Oculta textos e botões injetados por padrão pela biblioteca */
        #reader button, #reader select, #reader span, #reader header {
            display: none !important;
        }

        #reader canvas {
            display: none !important; /* Mantém o motor de análise ativo em background */
        }

        /* Camada visual por cima do vídeo da câmera */
        .app-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none; /* Deixa os cliques passarem "através" desta div */
        }

        .header {
            text-align: center;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Alvo central do Scanner */
        .scanner-target {
            position: relative;
            width: 320px;
            height: 320px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5); /* Corta e escurece as bordas */
            border-radius: 4px;
        }

        /* Linha Laser Animada */
        .laser-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, #0078FF, transparent);
            box-shadow: 0 0 8px #0078FF;
            animation: scanAnimation 2s linear infinite;
        }
        /*animacao para o scanner, dele subir e descer*/
        @keyframes scanAnimation {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Cantos do Quadrado */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid #ffffff;
        }
        /*É o quadrado no meio da tela */
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* Rodapé integrado do App */
        .footer {
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 24px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Botão para Forçar o Envio de Imagens */
        #upload-btn {
            margin-top: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto; /* IMPORTANTE: Faz o botão aceitar cliques do usuário */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        #upload-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Container da Câmera -->
    <div id="reader"></div>

    <!-- Interface visual por cima -->
    <div class="app-overlay">
        <div class="header">
            <h2>Escanear QR Code</h2>
            <p>Posicione o código dentro do quadrado</p>
        </div>

        <div class="scanner-target">
            <div class="laser-line"></div>
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <div class="footer">
            <p id="status-text">Aguardando leitura...</p>
            
            <!-- Input de arquivo invisível e isolado -->
            <input type="file" id="qr-input" accept="image/*" style="display: none;">
            
            <!-- Botão funcional do aplicativo -->
            <button id="upload-btn">📷 Enviar foto do QR Code</button>
        </div>
    </div>

    <script>
    
        // Inicializa a instância da biblioteca apontada para a div 'reader'
        const html5Qrcode = new Html5Qrcode("reader");
        const statusText = document.getElementById('status-text');

        // Função universal para validar, limpar o leitor e redirecionar
        function processarResultado(decodedText) {
            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                statusText.innerText = "Redirecionando...";
                window.location.href = decodedText;
            } else {
                alert("Conteúdo do QR Code:\n\n" + decodedText);
            }
        }

        // Função de sucesso do Scanner de Câmera
        function onScanSuccess(decodedText, decodedResult) {
            html5Qrcode.stop().then(() => {
                processarResultado(decodedText);
            }).catch(() => {
                processarResultado(decodedText);
            });
        }

        // Configurações técnicas de vídeo
        const config = { 
            fps: 20,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                return { width: 320, height: 320 }; 
            },
            aspectRatio: 1.0
        };

        // BLOCO DA CÂMERA: Isolado para que erros não quebrem o botão abaixo
        try {
            html5Qrcode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess
            ).catch(err => {
                console.warn("Aviso de inicialização automática da câmera:", err);
            });
        } catch (e) {
            console.warn("Erro tratado na inicialização visual:", e);
        }

        
        // EVENTOS DO BOTÃO DE UPLOAD (SISTEMA TOTALMENTE ISOLADO)

        const fileInput = document.getElementById('qr-input');
        const uploadBtn = document.getElementById('upload-btn');

        if (uploadBtn && fileInput) {
            // Clique limpo e isolado para abrir os arquivos do celular/computador
            uploadBtn.addEventListener('click', (e) => {
                e.preventDefault(); // nao deixa o navegador regarregar a pagina ao clicar no 'a' por exemplo
                e.stopPropagation(); // Impede interferências de outras camadas invisíveis, podendo sair do site
                fileInput.click();    // abre a galeria
            });

            // Gerencia o arquivo assim que ele é escolhido
            //parte que o usúario seleciona o qr code 
            fileInput.addEventListener('change', function(e) {
                if (!e.target.files || e.target.files.length === 0) {
                    return;
                }

        
                const imageFile = e.target.files[0];
                statusText.innerText = "Processando imagem...";
                
                // Executa a leitura direta do arquivo estático (Sem depender da webcam rodar)
                html5Qrcode.scanFile(imageFile, true)
                    .then(decodedText => {
                        // Se a câmera estava em execução paralela, desativa antes do redirecionamento
                        if (html5Qrcode.isScanning) {
                            html5Qrcode.stop().then(() => processarResultado(decodedText));
                        } else {
                            processarResultado(decodedText);
                        }
                    })
                    /**Obs: pelo cll ta funcionando tambem**/
                    .catch(err => {
                        statusText.innerText = "Falha na leitura.";
                        alert("Não foi possível identificar um QR Code nesta imagem. Certifique-se de que a foto esteja nítida, de perto e com boa iluminação.");
                        console.error("Erro interno no motor scanFile:", err);
                    });
            });
        }
    </script>
</body>
</html>
